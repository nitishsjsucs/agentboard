# Milestone releases (SPEC section 17, stretch).
#
# Pushing a tag `v*` runs the full CI workflow on the tagged commit, then creates
# a GitHub release whose notes are the tag's CHANGELOG.md section followed by the
# milestone demo script (`demos/milestone-N.md` for `v0.N.0`).
#
# Tags whose commits predate this file (v0.1.0 to v0.4.0) never trigger it: GitHub
# runs the workflow file of the tagged commit. For those, run it by hand
# (workflow_dispatch) with the tag name; it then reads the notes from the default
# branch and does not run CI. The four tags are on GitHub, and pushing them ran
# each tagged commit's own ci.yml: it passed for v0.1.0 to v0.3.0 and failed for
# v0.4.0 (results:check: the tagged commit's result files cite the working
# repository's commit id, which the published history does not contain). Decide
# how to handle v0.4.0 before dispatching its release. An existing release is
# left untouched.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish a release for
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    if: ${{ !cancelled() && (needs.ci.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.ci.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Write the release notes
        id: notes
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a release tag: $TAG" >&2; exit 1 ;;
          esac
          heading="$(grep -E "^## ${TAG//./\\.}(:|$)" CHANGELOG.md | head -n 1 || true)"
          if [ -z "$heading" ]; then
            echo "CHANGELOG.md has no section for $TAG" >&2
            exit 1
          fi
          awk -v heading="$heading" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          milestone="$(printf '%s' "$TAG" | sed -nE 's/^v0\.([0-9]+)\.0$/\1/p')"
          demo="demos/milestone-$milestone.md"
          if [ -n "$milestone" ] && [ -f "$demo" ]; then
            printf '\n## Demo script\n\n' >> release-notes.md
            # Nest the demo's headings two levels down, under "Demo script".
            sed -E 's/^(#+) /\1## /' "$demo" >> release-notes.md
          fi
          echo "title=${heading#\#\# }" >> "$GITHUB_OUTPUT"
      - name: Create the release
        env:
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; left untouched." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$TAG" --verify-tag --title "$TITLE" --notes-file release-notes.md
          echo "Created release $TAG: $TITLE" >> "$GITHUB_STEP_SUMMARY"
