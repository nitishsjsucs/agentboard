# Per-PR deployments to the shared `preview` environment (SPEC sections 17 and 18).
#
# Skips cleanly (the workflow still passes) unless both of these exist:
#   - the repository variable PREVIEW_DEPLOYS=on (checked by the gate job), and
#   - the secret CLOUDFLARE_API_TOKEN in the GitHub environment `preview`
#     (checked by the deploy job's first step; without it every later step is skipped).
# Pull requests from forks never deploy: the gate requires the head branch to live in
# this repository (and GitHub gives fork pull requests no secrets anyway).
#
# The `preview` environment has NO required reviewer, on purpose: the publish script
# merges a pull request only when `gh pr checks --watch` passes, and a job waiting for a
# reviewer stays pending, which would block every merge. The token is therefore exposed
# only to code pushed to a branch of this repository by someone with write access, who
# could change this workflow anyway; and it reaches only the cf:setup step, never
# `npm ci` (dependency install scripts) or the build.
#
# The preview resources (D1 databases, queues, Worker secrets, the Access application)
# are created once, locally, by `npm run cf:setup -- --env preview`; in CI the same
# script (--ci) creates nothing: it checks they exist, applies pending D1 migrations,
# deploys the build made by the step before it, and checks that Access protects the URL.
# Everything here works on the Workers Free plan.
#
# Cloudflare does not generate preview URLs for Workers that implement Durable Objects,
# so every pull request deploys to the one `agentboard-preview` Worker, one at a time.
name: preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          PREVIEW_DEPLOYS: ${{ vars.PREVIEW_DEPLOYS }}
          # Empty for workflow_dispatch; for a pull request, the repository its head branch lives in.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$PREVIEW_DEPLOYS" = "on" ] && { [ -z "$HEAD_REPO" ] || [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Preview deploy skipped: the repository variable PREVIEW_DEPLOYS is not 'on', or the pull request comes from a fork." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    # Holds the CLOUDFLARE_API_TOKEN secret. No required reviewer (see the top of this file).
    environment:
      name: preview
      url: https://agentboard-preview.nitish-ratakonda.workers.dev
    # One deploy at a time: there is one preview Worker.
    concurrency:
      group: preview-environment
      cancel-in-progress: false
    env:
      # Only whether the secret exists, never its value.
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Check for the deploy token
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "Preview deploy skipped: the \`preview\` environment has no CLOUDFLARE_API_TOKEN secret." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v7
        if: env.HAS_TOKEN == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.HAS_TOKEN == 'true'
        run: npm ci
      - name: Build for the preview environment
        if: env.HAS_TOKEN == 'true'
        run: npm run build:preview
      # The only step with the token: checks the preview resources and secrets exist,
      # applies pending D1 migrations, refuses any build but the preview one, deploys,
      # and checks that an unauthenticated request ends at the Access login.
      - name: Migrate and deploy with cf:setup --ci
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cf-setup.ts --env preview --ci --skip-build
      - name: Summary
        if: env.HAS_TOKEN == 'true'
        run: |
          echo "Deployed \`$GITHUB_SHA\` to the preview environment: https://agentboard-preview.nitish-ratakonda.workers.dev (behind Cloudflare Access)." >> "$GITHUB_STEP_SUMMARY"
