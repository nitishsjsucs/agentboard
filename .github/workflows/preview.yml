# Per-PR deployments to the shared `preview` environment (SPEC sections 17 and 18).
#
# Gated on repository secrets: without CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# (and on pull requests from forks, which never receive secrets) the deploy job is
# skipped and the workflow still passes. The preview resources are created once by
# hand (README, deploy step 10); this workflow only migrates and deploys.
#
# Cloudflare does not generate preview URLs for Workers that implement Durable
# Objects, so every pull request deploys to the one `agentboard-preview` Worker,
# and deploys are serialized. Every wrangler d1 command passes `--env preview`.
name: preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-environment
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Preview deploy skipped: the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are not available to this run." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Migrations run before the new code is deployed. `--config wrangler.jsonc`
      # keeps wrangler on the source config and its `preview` environment.
      - name: Apply D1 migrations to the preview databases
        run: |
          npx wrangler d1 migrations apply agentboard-preview --remote --env preview --config wrangler.jsonc
          npx wrangler d1 migrations apply agentboard-people-preview --remote --env preview --config wrangler.jsonc
      - name: Build for the preview environment
        run: npm run build:preview
      # `wrangler deploy` follows .wrangler/deploy/config.json to the built config;
      # refuse to deploy anything but the preview environment's.
      - name: Check the built configuration
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";
          import { dirname, resolve } from "node:path";
          const redirect = ".wrangler/deploy/config.json";
          const configPath = resolve(dirname(redirect), JSON.parse(readFileSync(redirect, "utf8")).configPath);
          const config = JSON.parse(readFileSync(configPath, "utf8"));
          const want = { name: "agentboard-preview", ENVIRONMENT: "preview", AUTH_MODE: "access", FAULT_INJECTION: "off", MCP_EXTERNAL: "off" };
          const got = { name: config.name, ...Object.fromEntries(Object.keys(want).slice(1).map((k) => [k, config.vars?.[k]])) };
          if (JSON.stringify(got) !== JSON.stringify(want)) {
            console.error(`refusing to deploy ${configPath}: ${JSON.stringify(got)}`);
            process.exit(1);
          }
          console.log(`deploying ${configPath} (${config.name}, ENVIRONMENT=${config.vars.ENVIRONMENT})`);
          EOF
      - name: Deploy
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "Deployed \`$GITHUB_SHA\` to the preview environment (Worker \`agentboard-preview\`)."
            if [ -n "$URL" ]; then echo "URL: $URL (behind Cloudflare Access)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
