name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  # release.yml runs this workflow on the tagged commit before it publishes a release.
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run types:check
      - run: npm run typecheck
      - run: npm run synth:check
      - run: npm test
      - run: npm run test:sim
      - run: npm run count:tests -- --check
      - run: npm run results:check
      - run: npm run build
      # SPEC section 20: keep an eye on the worker bundle against the Workers size limits.
      - name: Print the worker bundle size
        run: |
          for f in dist/agentboard/index.js dist/agentboard/assets/*.js; do
            printf '%s: %s bytes, %s bytes gzip\n' "$f" "$(wc -c < "$f" | tr -d ' ')" "$(gzip -9c "$f" | wc -c | tr -d ' ')"
          done | tee -a "$GITHUB_STEP_SUMMARY"
